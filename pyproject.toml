[project]
name = "three-d-models"
version = "0.1.0"
description = "Parametric 3D-printable parts with build123d"
requires-python = ">=3.13,<3.14"
dependencies = [
    "build123d>=0.11,<0.12",
]

[dependency-groups]
dev = [
    "ocp-vscode>=4,<5",
    "pytest>=8",
]

[project.scripts]
cad = "cadlib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadlib"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
